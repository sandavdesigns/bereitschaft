services:
  bereitschaft:
    image: ghcr.io/sandavdesigns/bereitschaft:latest
    container_name: bereitschaft
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY to a random value before deployment}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before deployment}"
      DATABASE_PATH: "/data/bereitschaft.sqlite"
      APP_PORT: "${APP_PORT:-8080}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
    volumes:
      - bereitschaft_data:/data

volumes:
  bereitschaft_data:
