{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Stammdaten</h1>
  <form method="post" class="form grid-form">
    <label>Personalnummer <input name="personnel_no" value="{{ user.personnel_no or '' }}"></label>
    <label>Vorname <input name="first_name" value="{{ user.first_name or '' }}"></label>
    <label>Name <input name="last_name" value="{{ user.last_name or '' }}"></label>
    <button class="primary">Speichern</button>
  </form>
</section>

<section class="panel narrow">
  <h2>Passwort ändern</h2>
  <form method="post" action="{{ url_for('change_password') }}" class="form stack">
    <label>Aktuelles Passwort <input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>Neues Passwort <input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
    <label>Neues Passwort wiederholen <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>
    <button class="primary">Passwort ändern</button>
  </form>
</section>
{% endblock %}
